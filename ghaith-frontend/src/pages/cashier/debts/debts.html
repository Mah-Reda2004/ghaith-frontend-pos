<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
  <title>المديونيات — غيث</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../../../assets/css/base/variables.css" />
  <link rel="stylesheet" href="../../../../assets/css/base/reset.css" />
  <link rel="stylesheet" href="../../../../assets/css/base/typography.css" />
  <link rel="stylesheet" href="../../../../assets/css/components/cards.css" />
  <link rel="stylesheet" href="../../../../assets/css/components/forms.css" />
  <link rel="stylesheet" href="../../../../assets/css/components/modal.css" />
  <link rel="stylesheet" href="../../../../assets/css/components/theme-toggle.css" />
  <link rel="stylesheet" href="../../../../assets/css/layout/topbar.css" />
  <link rel="stylesheet" href="../pos/pos.css" />
  <link rel="stylesheet" href="debts.css" />
</head>
<body>
  <div class="pos-shell">
    <header class="pos-topbar">
      <div class="pos-topbar__brand"><strong>غيث</strong><span>نقطة البيع</span></div>
      <nav class="pos-topbar__nav" id="posNav">
        <a href="../pos/pos.html" class="nav-pill" data-page="pos"><span>نقطة البيع</span></a>
        <a href="../invoices/invoices.html" class="nav-pill" data-page="invoices"><span>سجل الفواتير</span></a>
        <a href="debts.html" class="nav-pill is-active" data-page="debts"><span>المديونيات</span></a>
        <a href="../shift-close/shift-close.html" class="nav-pill" data-page="shift-close"><span>إغلاق الوردية</span></a>
        <a href="../expenses/expenses.html" class="nav-pill" data-page="expenses"><span>المصروفات</span></a>
      </nav>
      <div class="pos-topbar__actions">
        <button class="theme-toggle" id="themeToggleBtn" type="button" aria-label="تبديل الثيم">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <button class="pos-topbar__icon-btn" type="button" aria-label="الإشعارات"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg></button>
        <button class="pos-topbar__icon-btn" type="button" aria-label="مسح باركود"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg></button>
        <div class="pos-topbar__avatar"><span>AD</span></div>
        <button class="pos-logout" type="button"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg><span>Logout</span></button>
      </div>
    </header>

    <main class="debts-page">
      <div class="debts-page__header">
        <h1>المديونيات</h1>
        <div class="debts-toolbar">
          <button class="debts-filter-btn" id="refreshDebtsBtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>تحديث</button>
          <label class="debts-filter-btn debts-filter-select" for="dateFilterSelect"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg><select id="dateFilterSelect" aria-label="فلترة المديونيات حسب التاريخ"><option value="all">كل التواريخ</option><option value="today">اليوم</option><option value="week">آخر 7 أيام</option><option value="month">هذا الشهر</option></select></label>
          <label class="debts-filter-btn debts-filter-select" for="cashierFilterSelect"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 10h16M6 6h12l2 4H4l2-4Z"/><path d="M6 10v8h12v-8"/></svg><select id="cashierFilterSelect" aria-label="فلترة المديونيات حسب الكاشير"><option value="all">كل الكاشيرية</option></select></label>
        </div>
      </div>

      <div class="debts-search input-search">
        <input class="input" id="debtSearchInput" type="search" placeholder="بحث باسم العميل أو رقم الفاتورة..." autocomplete="off" />
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      </div>

      <p class="debts-results-count" id="debtsResultCount" aria-live="polite"></p>

      <section class="debts-list" id="debtsList" aria-live="polite"></section>

      <section class="empty-state debts-empty" id="debtsEmpty" hidden>
        <div class="debts-empty__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 7h5l2 2h11v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/><path d="M3 7V5a2 2 0 0 1 2-2h4l2 2h8"/></svg><span>★</span></div>
        <h2>لا توجد مديونيات حاليًا</h2>
        <p>يبدو أن منطقة الانتظار فارغة. يمكنك متابعة عمليات البيع الجديدة من خلال نقطة البيع الرئيسية.</p>
        <a class="btn btn-primary" href="../cashier.html#pos">بدء عملية بيع جديدة <b>+</b></a>
      </section>
    </main>
  </div>

  <div class="modal-overlay" id="debtDetailOverlay" hidden>
    <section class="modal debt-detail-modal" role="dialog" aria-modal="true" aria-labelledby="debtDetailTitle">
      <header class="debt-modal__header"><button class="btn-icon" id="closeDebtDetailBtn" type="button" aria-label="إغلاق">×</button><h2 id="debtDetailTitle">تفاصيل الفاتورة</h2></header>
      <div id="debtDetailBody"></div>
      <footer class="debt-modal__footer"><button class="btn btn-ghost" id="cancelDebtDetailBtn" type="button">إغلاق</button><button class="btn btn-primary" id="detailPayBtn" type="button">دفع المديونية</button><button class="btn btn-primary" id="detailPrintBtn" type="button">طباعة الفاتورة</button></footer>
    </section>
  </div>

  <div class="modal-overlay" id="debtPaymentOverlay" hidden>
    <section class="modal debt-payment-modal" role="dialog" aria-modal="true" aria-labelledby="debtPaymentTitle">
      <header class="debt-modal__header"><button class="btn-icon" id="closeDebtPaymentBtn" type="button" aria-label="إغلاق">×</button><h2 id="debtPaymentTitle"><span class="debt-modal__icon">▣</span> تسديد مديونية</h2></header>
      <div class="debt-payment__body" id="debtPaymentBody"></div>
      <footer class="debt-modal__footer"><button class="btn btn-ghost" id="cancelDebtPaymentBtn" type="button">إلغاء</button><button class="btn btn-primary" id="confirmDebtPaymentBtn" type="button">تأكيد التسديد</button></footer>
    </section>
  </div>

  <div class="toast-stack" id="toastStack"></div>
  <div id="printArea" class="print-area"></div>
  <script type="module" src="debts.js"></script>
</body>
</html>
