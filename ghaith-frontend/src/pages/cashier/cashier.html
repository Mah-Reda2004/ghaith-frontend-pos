<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark" data-cashier-spa="true">
<head>
  <meta charset="UTF-8" />
  <script src="../../core/auth-guard.js"></script>
  <link rel="icon" href="data:," />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
  <title>الكاشير — غيث</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../../assets/css/base/variables.css" />
  <link rel="stylesheet" href="../../../assets/css/base/reset.css" />
  <link rel="stylesheet" href="../../../assets/css/base/typography.css" />
  <link rel="stylesheet" href="../../../assets/css/components/cards.css" />
  <link rel="stylesheet" href="../../../assets/css/components/forms.css" />
  <link rel="stylesheet" href="../../../assets/css/components/table.css" />
  <link rel="stylesheet" href="../../../assets/css/components/modal.css" />
  <link rel="stylesheet" href="../../../assets/css/components/theme-toggle.css" />
  <link rel="stylesheet" href="../../../assets/css/layout/topbar.css" />
  <link rel="stylesheet" href="pos/pos.css" />
  <link rel="stylesheet" href="cashier.css" />
  <link rel="stylesheet" href="../../components/notifications/notifications.css" />
  <link rel="stylesheet" href="../../components/printing/printing.css" />
  <link rel="stylesheet" id="cashierRouteStyle" />
  <link rel="stylesheet" href="../../components/cashier-select/cashier-select.css" />
</head>
<body>
  <div class="pos-shell cashier-shell">
    <header class="pos-topbar">
      <div class="pos-topbar__brand"><strong>غيث</strong><span>نقطة البيع</span></div>
      <nav class="pos-topbar__nav" id="cashierNav" aria-label="تنقل الكاشير">
        <a href="#pos" class="nav-pill" data-route="pos"><span>نقطة البيع</span></a>
        <a href="#invoices" class="nav-pill" data-route="invoices"><span>سجل الفواتير</span></a>
        <a href="#debts" class="nav-pill" data-route="debts"><span>المديونيات</span></a>
        <a href="#shift-close" class="nav-pill" data-route="shift-close"><span>إغلاق الوردية</span></a>
        <a href="#expenses" class="nav-pill" data-route="expenses"><span>المصروفات</span></a>
      </nav>
      <div class="pos-topbar__actions">
        <button class="theme-toggle" id="themeToggleBtn" type="button" aria-label="تبديل الثيم">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <div class="notification-center" id="notificationCenter">
          <button class="pos-topbar__icon-btn notification-trigger" id="notificationTrigger" type="button" aria-label="الإشعارات" aria-haspopup="dialog" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg><span class="notification-count" id="notificationCount" hidden>0</span></button>
          <section class="notification-panel" id="notificationPanel" aria-label="مركز الإشعارات" hidden><header><div><h2>الإشعارات</h2><span id="notificationUnreadLabel">لا توجد إشعارات جديدة</span></div><button type="button" id="notificationMarkAll">تحديد الكل كمقروء</button></header><div class="notification-list" id="notificationList"></div><footer><button type="button" id="notificationClear">مسح الإشعارات المقروءة</button></footer></section>
        </div>
        <div class="pos-user-menu" id="cashierUserMenu" data-user-name="المستخدم">
          <button class="pos-topbar__avatar" id="userMenuBtn" type="button" aria-label="فتح قائمة المستخدم" aria-haspopup="menu" aria-expanded="false" aria-controls="userMenuDropdown">
            <span aria-hidden="true">AD</span>
          </button>
          <div class="pos-user-menu__dropdown" id="userMenuDropdown" role="menu" hidden>
            <div class="pos-user-menu__identity">
              <strong id="currentUserName">المستخدم</strong>
              <span>موظف مبيعات</span>
            </div>
            <div class="pos-user-menu__actions">
              <button class="pos-user-menu__item pos-user-menu__item--logout" type="button" role="menuitem" data-user-action="logout">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
                <span>تسجيل الخروج</span>
              </button>
              <a class="pos-user-menu__item" href="#profile" role="menuitem" data-user-action="profile">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="7" r="4"/></svg>
                <span>البروفايل</span>
              </a>
            </div>
          </div>
        </div>
      </div>
    </header>
    <main class="cashier-view" id="cashierView" aria-live="polite">
      <div class="cashier-view__loading"><div class="inv-spinner"></div><p>جاري تحميل الصفحة...</p></div>
    </main>
  </div>
  <script type="module" src="cashier.js"></script>
</body>
</html>
