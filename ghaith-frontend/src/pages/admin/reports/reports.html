<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <script src="../../../core/auth-guard.js"></script>
  <title>التقارير</title>
</head>
<body>
<section class="reports-page">
  <header class="page-header reports-header">
    <div><h1>التقارير</h1><p class="page-subtitle">تحليل أداء المتجر واستخراج التقارير التفصيلية</p></div>
    <button class="theme-toggle" id="reportsThemeToggle" type="button" aria-label="تبديل الثيم"><svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg><svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
  </header>

  <nav class="reports-tabs" id="reportsTabs" aria-label="أنواع التقارير">
    <button type="button" class="is-active" data-report="sales">المبيعات</button><button type="button" data-report="profits">الأرباح</button><button type="button" data-report="products">المنتجات</button><button type="button" data-report="suppliers">المشتريات والموردون</button><button type="button" data-report="inventory">إعادة تقييم المخزون</button><button type="button" data-report="debts">المديونيات</button><button type="button" data-report="expenses">المصروفات</button><button type="button" data-report="discounts">الخصومات</button><button type="button" data-report="commissions">العمولات</button><button type="button" data-report="returns">المرتجعات والاستبدالات</button>
  </nav>

  <div class="reports-view" id="reportsView" aria-live="polite"></div>
  <div class="toast-stack" id="reportsToastStack" aria-live="polite"></div>
</section>
</body>
</html>
