<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>إدارة الفئات والتصنيفات — غيث</title>
  <link rel="stylesheet" href="categories.css" />
</head>
<body>
  <section class="categories-page">
    <header class="content__header categories-header">
      <div>
        <h1 class="page-title">إدارة الفئات والتصنيفات</h1>
        <p class="page-subtitle">قم بإدارة وتصنيف منتجات متجرك لتسهيل التصفح</p>
      </div>
      <div class="categories-header__actions">
        <button class="theme-toggle" id="categoriesThemeToggle" type="button" aria-label="تبديل الثيم">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <button class="btn btn-primary categories-add" id="addCategoryBtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg><span>إضافة فئة جديدة</span></button>
      </div>
    </header>

    <section class="categories-stat-grid" aria-label="ملخص الفئات">
      <article class="category-stat category-stat--total"><div class="category-stat__top"><span>إجمالي الفئات</span><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 3 8 5-8 5-8-5 8-5Z"/><path d="m4 12 8 5 8-5M4 16l8 5 8-5"/></svg></i></div><strong class="num" id="totalCategoriesStat">24</strong></article>
      <article class="category-stat category-stat--products"><div class="category-stat__top"><span>إجمالي المنتجات المصنفة</span><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h12v18H6zM9 3v3h6V3"/><path d="m9 13 2 2 4-4"/></svg></i></div><strong class="num" id="categorizedProductsStat">1,450</strong></article>
      <article class="category-stat category-stat--active"><div class="category-stat__top"><span>الفئات النشطة</span><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="m8 12 2.5 2.5L16 9"/></svg></i></div><strong class="num" id="activeCategoriesStat">21</strong></article>
    </section>

    <section class="toolbar categories-toolbar" aria-label="البحث والتصفية">
      <label class="input-search categories-search"><input class="input" id="categoriesSearch" type="search" placeholder="البحث عن منتج، رمز SKU..." autocomplete="off" /><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg></label>
      <select class="select categories-filter" id="categoryProductsFilter" aria-label="تصفية حسب المنتجات"><option value="all">جميع التصنيفات</option><option value="with-products">بها منتجات</option><option value="empty">بدون منتجات</option></select>
      <select class="select categories-filter" id="categoryStatusFilter" aria-label="تصفية حسب الحالة"><option value="all">حالة التصنيف</option><option value="active">نشط</option><option value="inactive">غير نشط</option></select>
    </section>

    <section class="table-card categories-table-card" aria-label="جدول الفئات">
      <div class="table-responsive categories-table-wrap">
        <table class="data-table categories-table">
          <thead><tr><th>اسم الفئة</th><th>عدد المنتجات</th><th>الحالة</th><th>الإجراءات</th></tr></thead>
          <tbody id="categoriesTableBody"></tbody>
        </table>
        <div class="empty-state categories-empty" id="categoriesEmpty" hidden><svg class="empty-state__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16l-1 14H5L4 7Z"/><path d="M9 11h6"/></svg><h3>لا توجد فئات مطابقة</h3><p>جرّب تغيير البحث أو الفلاتر المستخدمة.</p></div>
      </div>
      <footer class="pagination categories-pagination">
        <span class="pagination__info" id="categoriesPaginationInfo">عرض 1 إلى 4 من 24 فئة</span>
        <div class="pagination__pages" aria-label="صفحات الفئات"><button class="page-btn" type="button" aria-label="التالي">‹</button><button class="page-btn is-active" type="button">1</button><button class="page-btn" type="button">2</button><button class="page-btn" type="button">3</button><button class="page-btn" type="button" aria-label="السابق">›</button></div>
      </footer>
    </section>

    <div class="modal-overlay categories-modal" id="categoryModal" hidden>
      <section class="modal categories-dialog" role="dialog" aria-modal="true" aria-labelledby="categoryModalTitle">
        <header class="modal__header categories-dialog__header"><h2 class="modal__title" id="categoryModalTitle">إضافة فئة جديدة</h2><button class="btn-icon" id="closeCategoryModal" type="button" aria-label="إغلاق"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button></header>
        <form id="categoryForm" novalidate>
          <div class="categories-dialog__body">
            <input id="categoryId" type="hidden" />
            <div class="field"><label for="categoryName">اسم الفئة</label><input class="input" id="categoryName" type="text" placeholder="أدخل اسم الفئة (مثال: العبايات الفاخرة)" required /><small class="categories-field-error" id="categoryNameError" hidden>يرجى إدخال اسم الفئة.</small></div>
            <div class="field"><label for="categoryDescription">الوصف</label><textarea class="input" id="categoryDescription" rows="4" placeholder="أدخل وصفاً تفصيلياً للفئة..."></textarea></div>
            <div class="field"><label for="categoryStatus">الحالة</label><select class="select" id="categoryStatus"><option value="active">نشط</option><option value="inactive">غير نشط</option></select></div>
          </div>
          <footer class="modal__actions categories-dialog__actions"><button class="btn btn-outline" id="cancelCategoryModal" type="button">إلغاء</button><button class="btn btn-primary" id="saveCategoryBtn" type="submit">حفظ الفئة</button></footer>
        </form>
      </section>
    </div>
    <div class="toast-stack" id="categoriesToastStack" aria-live="polite"></div>
  </section>
</body>
</html>
