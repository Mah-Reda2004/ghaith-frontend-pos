<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <script src="../../../core/auth-guard.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="../../../../assets/favicon.svg" />
  <title>الرئيسية — غيث</title>
  <link rel="stylesheet" href="dashboard.css" />
</head>
<body>
  <section class="dashboard-page">
    <header class="content__header dashboard-header">
      <div>
        <h1 class="page-title">الرئيسية</h1>
        <p class="page-subtitle">نظرة عامة على أداء النظام وحركة المتجر</p>
      </div>
      <div class="dashboard-header__actions">
        <button class="theme-toggle" id="dashboardThemeToggle" type="button" aria-label="تبديل الثيم">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <label class="dashboard-period">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>
          <select id="dashboardPeriod" aria-label="الفترة الزمنية"><option value="this_month">هذا الشهر</option><option value="this_week">هذا الأسبوع</option><option value="today">اليوم</option></select>
        </label>
      </div>
    </header>

    <div class="stat-grid dashboard-stat-grid">
      <article class="stat-card dashboard-stat-card dashboard-stat-card--sales">
        <div class="stat-card__body">
          <div class="stat-card__top"><span class="stat-card__icon dashboard-stat-card__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19h16M5 17h14l-1.5-9h-11L5 17ZM8 8V5h8v3"/></svg></span></div>
          <span class="stat-card__label">إجمالي المبيعات</span><strong class="stat-value num">—</strong>
        </div>
      </article>
      <article class="stat-card dashboard-stat-card dashboard-stat-card--orders">
        <div class="stat-card__body">
          <div class="stat-card__top"><span class="stat-card__icon dashboard-stat-card__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2v20l3-2 3 2 3-2 3 2V2l-3 2-3-2-3 2-3-2Z"/><path d="M9 9h6M9 13h6"/></svg></span></div>
          <span class="stat-card__label">عدد عمليات البيع</span><strong class="stat-value num">—</strong>
        </div>
      </article>
      <article class="stat-card dashboard-stat-card dashboard-stat-card--profit">
        <div class="stat-card__body">
          <div class="stat-card__top"><span class="stat-card__icon dashboard-stat-card__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 8h8v8H8zM12 6v2M12 16v2"/></svg></span></div>
          <span class="stat-card__label">صافي الربح</span><strong class="stat-value num">—</strong>
        </div>
      </article>
      <article class="stat-card dashboard-stat-card dashboard-stat-card--expenses">
        <div class="stat-card__body">
          <div class="stat-card__top"><span class="stat-card__icon dashboard-stat-card__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2"/><path d="M7 9h.01M17 15h.01"/></svg></span></div>
          <span class="stat-card__label">إجمالي المصروفات</span><strong class="stat-value num">—</strong>
        </div>
      </article>
    </div>

    <div class="dashboard-quick-grid">
      <article class="dashboard-quick-card"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="19" r="2"/><circle cx="18" cy="19" r="2"/><path d="M3 4h2l2.5 10h10l2-7H7"/></svg>إجمالي المشتريات</span><strong class="num">—</strong></article>
      <article class="dashboard-quick-card dashboard-quick-card--warning"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4l16 16M6 6v10h12v-6M9 10h6"/></svg>المديونيات</span><strong class="num">—</strong></article>
      <article class="dashboard-quick-card"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h12v18H6zM9 3v3h6V3"/></svg>قيمة المخزون</span><strong class="num">—</strong></article>
      <article class="dashboard-quick-card"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 21v-4a4 4 0 0 1 8 0v4M5 10h14M9 10V6h6v4M6 14h2M16 14h2"/></svg>عدد المنتجات</span><strong class="num">—</strong></article>
    </div>

    <div class="dashboard-charts">
      <section class="card dashboard-chart-card dashboard-chart-card--line">
        <div class="dashboard-chart-card__header">
          <h2>أداء المبيعات <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 17 5-5 4 4 8-10"/></svg></h2>
          <div class="dashboard-chart-tabs" role="group" aria-label="الفترة"><button type="button" data-chart-period="daily">يومي</button><button type="button" data-chart-period="weekly">أسبوعي</button><button class="is-active" type="button" data-chart-period="monthly">شهري</button></div>
        </div>
        <div class="dashboard-line-chart" id="dashboardSalesChart" aria-label="رسم أداء المبيعات"></div>
      </section>
      <section class="card dashboard-chart-card dashboard-chart-card--donut">
        <h2>المبيعات حسب التصنيف <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3v9h9"/></svg></h2>
        <div class="dashboard-donut" id="dashboardCategoryChart" aria-label="توزيع المبيعات حسب التصنيف"></div>
        <div class="dashboard-legend" id="dashboardCategoryLegend"></div>
      </section>
    </div>
  </section>
</body>
</html>
