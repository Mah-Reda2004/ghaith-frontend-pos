<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark"><head><meta charset="UTF-8"><script src="../../../core/auth-guard.js"></script><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" type="image/svg+xml" href="../../../../assets/favicon.svg"><title>إعدادات الخصومات — غيث</title></head>
<body>
<section class="discounts-page">
  <header class="discounts-header">
    <div><h1 class="page-title">أنواع العملاء</h1><p class="page-subtitle">إدارة أسماء أنواع العملاء التي يختارها الكاشير لكل فاتورة.</p></div>
    <button class="theme-toggle" id="discountsThemeToggle" type="button" aria-label="تبديل الثيم"><svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg><svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
  </header>

  <section class="table-card discount-table-card" aria-labelledby="discountTableTitle">
    <header><h2 id="discountTableTitle">أنواع العملاء</h2><button class="btn btn-primary" id="addDiscount" type="button"><span>＋</span> إضافة نوع عميل</button></header>
    <div class="table-responsive"><table class="data-table discount-table"><thead><tr><th>نوع العميل</th><th>الحالة</th><th>الإجراءات</th></tr></thead><tbody id="discountTableBody"></tbody></table></div>
  </section>

  <section class="table-card discount-table-card expense-types-card" aria-labelledby="expenseTypesTitle"><header><div><h2 id="expenseTypesTitle">أنواع المصروفات</h2><p class="page-subtitle">أضف الأنواع التي ستظهر للكاشير عند تسجيل المصروف.</p></div></header><form id="expenseTypeForm" class="expense-type-form" novalidate><label class="field" for="expenseTypeName"><span>اسم نوع المصروف</span><input class="input" id="expenseTypeName" maxlength="100" placeholder="مثال: صيانة" required></label><button class="btn btn-primary" id="saveExpenseType" type="submit">إضافة النوع</button><small class="discount-error" id="expenseTypeError" aria-live="polite"></small></form><div class="expense-type-list" id="expenseTypeList" aria-live="polite">جاري تحميل الأنواع...</div></section>

  <div class="modal-overlay discount-modal" id="discountModal" hidden><article class="modal" role="dialog" aria-modal="true" aria-labelledby="discountModalTitle"><header class="modal__header"><h2 class="modal__title" id="discountModalTitle">تعديل نوع العميل</h2><button class="btn-icon discount-close" type="button" data-close aria-label="إغلاق">×</button></header><form id="discountForm" novalidate><label class="field"><span>اسم نوع العميل</span><input class="input" id="discountName" required autocomplete="off"></label><small class="discount-error" id="discountError" aria-live="polite"></small><div class="modal__actions"><button class="btn btn-primary" type="submit" id="saveDiscount">حفظ</button><button class="btn btn-outline" type="button" data-close>إلغاء</button></div></form></article></div>

  <div class="discount-success" id="discountSuccess" hidden role="status"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg></span><h3>تم الحفظ بنجاح</h3><p>تم حفظ نوع العميل.</p><button class="btn btn-outline" type="button" id="closeSuccess">إغلاق</button></div>
</section>
</body></html>
